<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベントモデリング・ガントの表示改善</title><style>body{font:16px system-ui;color:#25384b;background:#f5f7fa;margin:32px;max-width:1600px}h1{font-size:26px}h2{margin-top:40px}figure{margin:16px 0;background:white;border:1px solid #e0e7ef;border-radius:12px;padding:20px}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:100%;height:auto}a{color:#087f72}</style><h1>イベントモデリング・ガントの表示改善</h1><p>接続と日程の意味を保ち、配置・配線・文字の階層を整理。</p><h2>イベントモデリング</h2><p>役割別の3レーン、名前空間を残したカード、揃えた接続位置。空いた経路は直線化し、迂回線は少ない折れと小さな角丸で表示。</p><figure><figcaption>変更前</figcaption><img src="event-before.svg" alt="変更前のイベントモデリング"></figure><figure><figcaption>変更後</figcaption><img src="../business-overview/eventmodeling.svg" alt="変更後のイベントモデリング"></figure><h2>ガントチャート</h2><p>日付を見出しに集約し、各作業の時刻を簡潔に表示。見出し帯・行の補助線・控えめな依存線で比較しやすく。</p><figure><figcaption>変更前</figcaption><img src="gantt-before.svg" alt="変更前のガント"></figure><figure><figcaption>変更後</figcaption><img src="../gantt/minute-columns.svg" alt="変更後のガント"></figure><p><a href="../../../playground/?sample=eventmodeling">イベントモデリングを編集</a> · <a href="../../../playground/?sample=gantt">ガントを編集</a></p></html>
