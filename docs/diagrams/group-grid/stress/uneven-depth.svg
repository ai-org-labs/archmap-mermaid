ke="#60758a" stroke-width="1.7" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g class="archmap-group" data-group="Root"><rect x="48" y="48" width="1612" height="512" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="64" y="72" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="64" dy="0">全体</tspan></text></g><g class="archmap-group" data-group="Small"><rect x="70" y="94" width="284" height="190" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="86" y="118" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="86" dy="0">小さい枝</tspan></text></g><g class="archmap-group" data-group="Deep"><rect x="402" y="94" width="1236" height="444" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="418" y="118" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="418" dy="0">深い枝</tspan></text></g><g class="archmap-group" data-group="L2"><rect x="424" y="140" width="904" height="376" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="440" y="164" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="440" dy="0">第二階層</tspan></text></g><g class="archmap-group" data-group="L3"><rect x="446" y="186" width="860" height="156" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="462" y="210" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="462" dy="0">第三階層</tspan></text></g><g class="archmap-group" data-group="Empty"><rect x="70" y="348" width="284" height="190" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="86" y="372" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="86" dy="0">空のグループ</tspan></text></g><path class="archmap-edge" d="M 1044 276 L 996 276" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path clas