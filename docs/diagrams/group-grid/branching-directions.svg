<svg xmlns="http://www.w3.org/2000/svg" width="2472" height="1132" viewBox="0 0 2472 1132" role="img" aria-label="System architecture" style="font-family:Inter, &quot;Noto Sans JP&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title>System architecture</title><desc>11 nodes and 11 connections. 受付API, 認証, 検証, 実行, 集計, レポート, 再試行ワーカー, 業務DB, アーカイブ, 決済, 通知.</desc><defs><marker id="archmap-solid-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0 H -9 Z" fill="#60758a"/></g></marker><marker id="archmap-solid-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0 H -9 Z" fill="#60758a"/></g></marker><marker id="archmap-open-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0"/></g></marker><marker id="archmap-open-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0"/></g></marker><marker id="archmap-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6 M -11 -6 V 6"/></g></marker><marker id="archmap-zero-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6"/><circle cx="-15" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-many" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 -6 L -10 0 L 0 6 M -15 -6 V 6"/></g></marker><marker id="archmap-zero-many" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 -6 L -10 0 L 0 6"/><circle cx="-17" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-generalization" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 0 L -13 -7 L -13 7 Z" fill="#fff"/></g></marker><marker id="archmap-circle" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><circle cx="-4" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-cross" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -8 -4 L 0 4 M -8 4 L 0 -4"/></g></marker><marker id="archmap-arrow-filled" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#60758a"/></marker><marker id="archmap-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758a" stroke-width="1.7" stroke-linejoin="round"/></marker><marker id="archmap-arrow-start" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758a" stroke-width="1.7" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g class="archmap-group" data-group="Platform"><rect x="48" y="48" width="2376" height="664" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="64" y="72" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="64" dy="0">サービス基盤 / 子が3つ</tspan></text></g><g class="archmap-group" data-group="Web"><rect x="70" y="94" width="596" height="156" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="86" y="118" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="86" dy="0">Web / LR</tspan></text></g><g class="archmap-group" data-group="Workers"><rect x="738" y="94" width="996" height="596" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="754" y="118" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="754" dy="0">処理 / 内部もグリッド</tspan></text></g><g class="archmap-group" data-group="Fast"><rect x="760" y="360" width="284" height="308" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="776" y="384" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="776" dy="0">即時処理 / TB</tspan></text></g><g class="archmap-group" data-group="Batch"><rect x="760" y="140" width="596" height="156" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="776" y="164" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="776" dy="0">バッチ / LR</tspan></text></g><g class="archmap-group" data-group="Retry"><rect x="1428" y="140" width="284" height="156" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="1444" y="164" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="1444" dy="0">再試行 / TB</tspan></text></g><g class="archmap-group" data-group="Data"><rect x="1806" y="94" width="596" height="156" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="1822" y="118" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="1822" dy="0">データ / 横2列</tspan></text></g><g class="archmap-group" data-group="External"><rect x="48" y="776" width="284" height="308" rx="16" fill="#f6f8fb" fill-opacity="1" stroke="#8da7bf" /><text x="64" y="800" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="64" dy="0">外部サービス / TB</tspan></text></g><path class="archmap-edge" d="M 332 184 L 404 184" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 902 494 L 902 558" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1022 230 L 1094 230" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 2068 184 L 2140 184" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 190 910 L 190 974" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 644 184 L 713 184 L 713 450 L 782 450" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1022 602 L 1812 602 L 1812 184 L 1828 184" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1570 274 L 1570 586 L 1022 586" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1334 230 L 1350 230 L 1350 78 L 2260 78 L 2260 140" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 92 184 L 54 184 L 54 866 L 70 866" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 310 1018 L 326 1018 L 326 494 L 1434 494 L 1434 230 L 1450 230" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><g class="archmap-node" data-node="gateway"><title>受付API</title><rect x="92" y="140" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="114" y="188.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="114" dy="0">受付API</tspan></text></g><g class="archmap-node" data-node="auth"><title>認証</title><rect x="404" y="140" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="426" y="188.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="426" dy="0">認証</tspan></text></g><g class="archmap-node" data-node="validate"><title>検証</title><rect x="782" y="406" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="804" y="454.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="804" dy="0">検証</tspan></text></g><g class="archmap-node" data-node="execute"><title>実行</title><rect x="782" y="558" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="804" y="606.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="804" dy="0">実行</tspan></text></g><g class="archmap-node" data-node="aggregate"><title>集計</title><rect x="782" y="186" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="804" y="234.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="804" dy="0">集計</tspan></text></g><g class="archmap-node" data-node="report"><title>レポート</title><rect x="1094" y="186" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="1116" y="234.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="1116" dy="0">レポート</tspan></text></g><g class="archmap-node" data-node="retry"><title>再試行ワーカー</title><rect x="1450" y="186" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="1472" y="234.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="1472" dy="0">再試行ワーカー</tspan></text></g><g class="archmap-node" data-node="db"><title>業務DB</title><path d="M 1828 155 C 1828 136 2068 136 2068 155 L 2068 213 C 2068 233 1828 233 1828 213 Z" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><path d="M 1828 155 C 1828 175 2068 175 2068 155" fill="none" stroke="#8da7bf" stroke-width="1.4"/><text x="1850" y="197.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="1850" dy="0">業務DB</tspan></text></g><g class="archmap-node" data-node="archive"><title>アーカイブ</title><path d="M 2140 155 C 2140 136 2380 136 2380 155 L 2380 213 C 2380 233 2140 233 2140 213 Z" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><path d="M 2140 155 C 2140 175 2380 175 2380 155" fill="none" stroke="#8da7bf" stroke-width="1.4"/><text x="2162" y="197.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="2162" dy="0">アーカイブ</tspan></text></g><g class="archmap-node" data-node="payment"><title>決済</title><rect x="70" y="822" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="92" y="870.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="92" dy="0">決済</tspan></text></g><g class="archmap-node" data-node="receipt"><title>通知</title><rect x="70" y="974" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="92" y="1022.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="92" dy="0">通知</tspan></text></g></svg>