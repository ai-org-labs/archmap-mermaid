<svg xmlns="http://www.w3.org/2000/svg" width="468" height="660" viewBox="0 0 468 660" role="img" aria-label="System architecture" style="font-family:Inter, &quot;Noto Sans JP&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title>System architecture</title><desc>3 nodes and 2 connections. 入口, API, データベース.</desc><defs><marker id="archmap-solid-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0 H -9 Z" fill="#60758a"/></g></marker><marker id="archmap-solid-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0 H -9 Z" fill="#60758a"/></g></marker><marker id="archmap-open-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0"/></g></marker><marker id="archmap-open-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0"/></g></marker><marker id="archmap-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6 M -11 -6 V 6"/></g></marker><marker id="archmap-zero-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6"/><circle cx="-15" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-many" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 -6 L -10 0 L 0 6 M -15 -6 V 6"/></g></marker><marker id="archmap-zero-many" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 -6 L -10 0 L 0 6"/><circle cx="-17" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-generalization" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M 0 0 L -13 -7 L -13 7 Z" fill="#fff"/></g></marker><marker id="archmap-circle" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><circle cx="-4" cy="0" r="4" fill="#fff"/></g></marker><marker id="archmap-cross" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -8 -4 L 0 4 M -8 4 L 0 -4"/></g></marker><marker id="archmap-arrow-filled" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#60758a"/></marker><marker id="archmap-arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758a" stroke-width="1.7" stroke-linejoin="round"/></marker><marker id="archmap-arrow-start" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#60758a" stroke-width="1.7" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g class="archmap-group" data-group="cloud"><rect x="48" y="48" width="372" height="564" rx="16" fill="#38bdf8b3" fill-opacity="1" stroke="#0369a1" /><text x="64" y="72" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="64" dy="0">親：クラウド環境</tspan></text></g><g class="archmap-group" data-group="app"><rect x="70" y="230" width="328" height="360" rx="16" fill="#38bdf8b3" fill-opacity="1" stroke="#0369a1" /><text x="86" y="254" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="86" dy="0">子：アプリケーション</tspan></text></g><g class="archmap-group" data-group="data"><rect x="92" y="412" width="284" height="156" rx="16" fill="#38bdf8b3" fill-opacity="1" stroke="#0369a1" /><text x="108" y="436" font-size="14" font-weight="600" fill="#334e65" text-anchor="start"><tspan x="108" dy="0">孫：データ層</tspan></text></g><path class="archmap-edge" d="M 310 138 L 348 138 L 348 320 L 332 320" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 212 364 L 212 411 L 234 411 L 234 458" fill="none" stroke="#60758a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><g class="archmap-node" data-node="ingress"><title>入口</title><rect x="70" y="94" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="92" y="142.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="92" dy="0">入口</tspan></text></g><g class="archmap-node" data-node="api"><title>API</title><rect x="92" y="276" width="240" height="88" rx="3" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><text x="114" y="324.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="114" dy="0">API</tspan></text></g><g class="archmap-node" data-node="db"><title>データベース</title><path d="M 114 473 C 114 454 354 454 354 473 L 354 531 C 354 551 114 551 114 531 Z" fill="#ffffff" stroke="#8da7bf" stroke-width="1.4"/><path d="M 114 473 C 114 493 354 493 354 473" fill="none" stroke="#8da7bf" stroke-width="1.4"/><text x="136" y="515.5" font-size="16" font-weight="600" fill="#25384b" text-anchor="start"><tspan x="136" dy="0">データベース</tspan></text></g></svg>