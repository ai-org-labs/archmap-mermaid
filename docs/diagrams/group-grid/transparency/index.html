<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subgraph 背景透過の比較</title><style>body{font:16px system-ui;margin:32px;background:#f5f7fa;color:#163449}img{width:100%;background:white}a{color:#0369a1}p{line-height:1.8}</style><h1>入れ子の背景透過</h1><p>親・子・孫の3階層。枠線は不透明のまま、背景だけを変更しています。</p><img src="comparison.svg" alt="不透明、透過率30%、完全透過の比較"><p><a href="opaque.mmd">不透明（透過率0%）のMermaid</a> ／ <a href="alpha30.mmd">透過率30%（不透明度70%）のMermaid</a> ／ <a href="clear.mmd">完全透過（透過率100%）のMermaid</a><br><a href="comparison.png">比較PNG</a> ／ <a href="comparison.svg">比較SVG</a></p><p>透過率30%は「色を70%残す」指定です。薄く30%だけ色を残すなら <code>#38bdf84d</code>（透過率70%）。</p><h2>枠線と接続線の修正前後</h2><div style="display:flex;gap:24px;max-width:1000px"><figure style="flex:1;margin:0"><figcaption>修正前：孫グループの上辺と重なる</figcaption><img src="before/alpha30.svg"></figure><figure style="flex:1;margin:0"><figcaption>修正後：枠線から8px離す</figcaption><img src="alpha30.svg"></figure></div>
