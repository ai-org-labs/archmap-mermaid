rchmap-node" data-node="Valid"><title>入力は有効？</title><path d="M 690 298 L 830 368 L 690 438 L 550 368 Z" fill="#edf4ff" stroke="#b9d2f5" stroke-width="1.4"/><text x="690" y="372.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="middle"><tspan x="690" dy="0">入力は有効？</tspan></text></g><g class="archmap-node archmap-junction" data-node="Fork" data-kind="fork"><title>Fork</title><rect x="180" y="567" width="120" height="10" rx="2" fill="#2873dc"/><text x="324" y="575.5" font-size="12" font-weight="600" fill="#334155" text-anchor="start"><tspan x="324" dy="0">Fork</tspan></text></g><g class="archmap-node" data-node="Correct"><title>入力内容を修正する</title><rect x="1470" y="324" width="240" height="88" rx="12" fill="#fff" stroke="#b9d2f5" stroke-width="1.4"/><rect x="1470" y="339" width="3" height="58" rx="1.5" fill="#2873dc"/><text x="1492" y="372.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="1492" dy="0">入力内容を修正する</tspan></text></g><g class="archmap-node" data-node="Reserve"><title>在庫を確保する</title><rect x="120" y="732" width="240" height="88" rx="12" fill="#fff" stroke="#b9d2f5" stroke-width="1.4"/><rect x="120" y="747" width="3" height="58" rx="1.5" fill="#2873dc"/><text x="142" y="780.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="142" dy="0">在庫を確保する</tspan></text></g><g class="archmap-node" data-node="Charge"><title>決済を実行する</title><rect x="570" y="732" width="240" height="88" rx="12" fill="#fff" stroke="#b9d2f5" stroke-width="1.4"/><rect x="570" y="747" width="3" height="58" rx="1.5" fill="#2873dc"/><text x="592" y="780.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="592" dy="0">決済を実行する</tspan></text></g><g class="archmap-node archmap-junction" data-node="Join" data-kind="join"><title>Join</title><rect x="180" y="975" width="120" height="10" rx="2" fill="#2873dc"/><text x="324" y="983.5" font-size="12" font-weight="600" fill="#334155" text-anchor="start"><tspan x