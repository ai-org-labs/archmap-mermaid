 x="592" y="968.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="592" dy="0">プレビューを生成する</tspan></text></g><g class="archmap-node archmap-junction" data-node="complete" data-kind="join"><title>両方完了</title><rect x="180" y="1147" width="120" height="10" rx="2" fill="#2873dc"/><text x="324" y="1155.5" font-size="12" font-weight="600" fill="#334155" text-anchor="start"><tspan x="324" dy="0">両方完了</tspan></text></g><g class="archmap-node" data-node="save"><title>解析結果を保存する</title><rect x="120" y="1296" width="240" height="88" rx="12" fill="#fff" stroke="#b9d2f5" stroke-width="1.4"/><rect x="120" y="1311" width="3" height="58" rx="1.5" fill="#2873dc"/><text x="142" y="1344.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="142" dy="0">解析結果を保存する</tspan></text></g><g class="archmap-node" data-node="reject"><title>受付エラーを返す</title><rect x="570" y="732" width="240" height="88" rx="12" fill="#fff" stroke="#b9d2f5" stroke-width="1.4"/><rect x="570" y="747" width="3" height="58" rx="1.5" fill="#2873dc"/><text x="592" y="780.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="592" dy="0">受付エラーを返す</tspan></text></g><g class="archmap-node" data-node="root_start"><title>開始</title><rect x="120" y="168" width="240" height="88" rx="44" fill="#edf4ff" stroke="#2873dc" stroke-width="1.4"/><text x="240" y="216.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="middle"><tspan x="240" dy="0">開始</tspan></text></g><g class="archmap-node" data-node="root_end"><title>終了</title><rect x="120" y="1484" width="240" height="88" rx="44" fill="#edf4ff" stroke="#2873dc" stroke-width="2.8"/><text x="240" y="1532.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="middle"><tspan x="240" dy="0">終了</tspan></text></g><g class="archmap-edge-label"><rect x="218.28" y="701.5" width="43.44" height="26" rx="5" fill="#fff" stroke="#e8edf4" stroke-width=".8"/><text x="240" y="718.5" font-size="12" font-w