<svg xmlns="http://www.w3.org/2000/svg" width="3310" height="272" viewBox="0 0 3310 272" role="img" aria-label="System architecture" style="font-family:Inter, &quot;Noto Sans JP&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;background:#fff"><title>System architecture</title><desc>8 nodes and 7 connections. 利用者, 受付, 検証, 登録, 処理, 保存, 通知, 完了.</desc><defs><marker id="archmap-solid-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0 H -9 Z" fill="#7b8ba0"/></g></marker><marker id="archmap-solid-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0 H -9 Z" fill="#7b8ba0"/></g></marker><marker id="archmap-open-half-top" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 -6 L 0 0"/></g></marker><marker id="archmap-open-half-bottom" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -9 6 L 0 0"/></g></marker><marker id="archmap-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6 M -11 -6 V 6"/></g></marker><marker id="archmap-zero-one" viewBox="-24 -9 26 18" markerWidth="26" markerHeight="18" refX="0" refY="0" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><g stroke="#526981" stroke-width="1.5" fill="none"><path d="M -5 -6 V 6"/><circle cx="-15" cy="0" r="4" fill="#fff"/></