" stroke="#7b8ba0" stroke-width="1.7" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><path class="archmap-edge" d="M 340 138 L 510 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 750 138 L 920 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1160 138 L 1330 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1570 138 L 1740 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 1980 138 L 2150 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 2390 138 L 2560 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><path class="archmap-edge" d="M 2800 138 L 2970 138" fill="none" stroke="#7b8ba0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#archmap-arrow)"/><g class="archmap-node" data-node="A"><title>利用者</title><rect x="100" y="94" width="240" height="88" rx="3" fill="#edf4ff" stroke="#b9d2f5" stroke-width="1.4"/><text x="122" y="142.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="122" dy="0">利用者</tspan></text></g><g class="archmap-node" data-node="B"><title>受付</title><rect x="510" y="94" width="240" height="88" rx="3" fill="#edf4ff" stroke="#b9d2f5" stroke-width="1.4"/><text x="532" y="142.5" font-size="15" font-weight="600" fill="#25364b" text-anchor="start"><tspan x="532" dy="0">受付</tspan></text></g><g class="archm